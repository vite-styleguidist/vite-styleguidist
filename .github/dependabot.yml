# Dependabot version updates: one weekly sweep, grouped so a routine week produces a
# handful of PRs instead of dozens. Security updates are a separate GitHub feature that
# does not read this file (enable "Dependabot security updates" under Settings > Code
# security and analysis).
#
# Only minor + patch bumps are grouped; majors arrive as individual PRs because each one
# deserves its own review (and, for the package itself, may be a breaking change for users).
version: 2

# While 1.0 is in beta every change lands on `next` (main only moves by fast-forward, see
# docs/Maintenance.md#promoting-next-to-main), so the pull requests target `next` and each
# bump ships as a prerelease. Drop the `target-branch` lines once 1.0.0 is on main.
# The commit-message prefix makes the titles Conventional Commits (`build(deps): bump …`),
# which the "PR title is a Conventional Commit" check requires.
updates:
  # The package itself (dependencies, devDependencies, and the release/lint tooling).
  - package-ecosystem: npm
    directory: /
    target-branch: next
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # Pinned to ^9 on purpose: 10.x needs conventional-changelog-writer 9 while
      # @semantic-release/release-notes-generator still bundles 8 (see release.config.js).
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The documentation site is its own npm project.
  - package-ecosystem: npm
    directory: /site
    target-branch: next
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The eight examples built in CI. Listing them under one entry lets Dependabot open a
  # single PR that bumps the same dependency across all of them (e.g. a new React major),
  # which is how they should move anyway. They have no lockfiles, so with the caret ranges
  # they use only out-of-range (major) versions produce a PR.
  # The `file:../../` link back to the package is ignored by Dependabot.
  - package-ecosystem: npm
    directories:
      - /examples/basic
      - /examples/customised
      - /examples/express
      - /examples/preact
      - /examples/sections
      - /examples/styled-components
      - /examples/themed
      - /examples/vite
    target-branch: next
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # The actions used by .github/workflows/*.yml (actions/checkout, actions/setup-node, ...).
  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    commit-message:
      prefix: build
      include: scope
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      github-actions:
        patterns:
          - '*'
