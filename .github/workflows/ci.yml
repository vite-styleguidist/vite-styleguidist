name: CI

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next
    # `edited` re-runs the PR-title check when a rejected title is fixed; the other jobs skip it.
    types: [opened, synchronize, reopened, edited]

# Least privilege: nothing in CI writes to the repository. Releasing has its own workflow.
permissions:
  contents: read

# A new push to the same branch or pull request cancels the runs still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # No job in this workflow pushes; keep the token out of the checkout so untrusted
          # install scripts and tests cannot read it.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  pr-title:
    name: PR title is a Conventional Commit
    # Pull requests are squash-merged, so the PR title becomes the commit message that
    # semantic-release reads (see commitlint.config.js and release.config.js). Checking it
    # here catches a bad title before it can produce a wrong, or missing, release.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # No job in this workflow pushes; keep the token out of the checkout so untrusted
          # install scripts and tests cannot read it.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      # Only commitlint is needed here: skip husky's `prepare` and every dependency install script.
      - run: npm ci --ignore-scripts
      - name: Run commitlint against the title
        env:
          # Passed through the environment rather than interpolated into the script, so a
          # title containing quotes or backticks cannot break out of the shell.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx --no-install commitlint

  test:
    name: Unit tests (Node ${{ matrix.node-version }})
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version:
          - '22'
          - '24'
    steps:
      - uses: actions/checkout@v7
        with:
          # No job in this workflow pushes; keep the token out of the checkout so untrusted
          # install scripts and tests cannot read it.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # The CLI spec runs the compiled bin from lib/
      - run: npm run compile
      - run: npm run test:unit

  integration:
    name: Examples and end-to-end tests
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    # The eight example builds dominate now that the browser is a cached ~0.5 GB download
    # instead of ~1.7 GB of Cypress plus puppeteer binaries fetched on every run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # No job in this workflow pushes; keep the token out of the checkout so untrusted
          # install scripts and tests cannot read it.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run compile

      - name: Build all examples
        run: |
          npm run build:basic
          npm run build:customised
          npm run build:sections
          npm run build:themed
          npm run build:express
          npm run build:preact
          npm run build:styled-components
          npm run build:vite

      # Playwright's browser builds are coupled to the installed @playwright/test version, so
      # the cache key is derived from the version `npm ci` resolved from package-lock.json,
      # not from the range in package.json; a Dependabot bump invalidates the cache by itself.
      - name: Read the installed Playwright version
        id: playwright
        run: echo "version=$(node -p 'require("@playwright/test/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Idempotent: on a cache hit the download is skipped and only the OS packages that
      # headless Chromium needs are installed (via passwordless sudo on the hosted runners).
      - run: npx playwright install --with-deps chromium

      # The dev-server suite (test/e2e/core.spec.ts, component.spec.ts) and the smoke test of
      # the eight builds above (test/e2e/examples.spec.ts); playwright.config.ts starts and
      # stops the dev server itself.
      - run: npm run test:e2e

      # Screenshots, traces and the HTML report of a failed run, so a red job can be diagnosed
      # without reproducing it locally. Green runs upload nothing.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  tarball:
    name: Install from the packed tarball
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    # Every other job reaches the package through `file:../../` links or Vite aliases, which
    # bypass the `exports` map entirely. This job installs the real tarball into a scratch
    # project and builds a style guide whose `styleguideComponents` override deep-imports a
    # renderer from `vite-styleguidist/lib/...`: the exact resolution path a user takes and
    # the one nothing else tests. To reproduce locally, run the two `run:` blocks below with
    # RUNNER_TEMP set to a temporary directory.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # No job in this workflow pushes; keep the token out of the checkout so untrusted
          # install scripts and tests cannot read it.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run compile

      - name: Pack the tarball
        id: pack
        # `npm pack --json` reports the generated filename, which embeds the version.
        run: |
          filename="$(npm pack --pack-destination "$RUNNER_TEMP" --json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename')"
          echo "tarball=$RUNNER_TEMP/$filename" >> "$GITHUB_OUTPUT"

      - name: Build a style guide from a scratch project
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/tarball-smoke"
          mkdir -p "$scratch/src/components"
          cd "$scratch"
          npm init -y > /dev/null
          # react/react-dom are peer dependencies; everything else comes with the tarball.
          npm install --no-audit --no-fund react react-dom prop-types "$TARBALL"

          cat > styleguide.config.js <<'EOF'
          const path = require('path');

          module.exports = {
          	components: 'src/components/**/[A-Z]*.js',
          	styleguideComponents: {
          		SectionsRenderer: path.join(__dirname, 'src/SectionsRenderer.js'),
          	},
          };
          EOF

          # The override wraps the default renderer, imported through the package's `exports` map.
          cat > src/SectionsRenderer.js <<'EOF'
          import React from 'react';
          import DefaultSectionsRenderer from 'vite-styleguidist/lib/client/rsg-components/Sections/SectionsRenderer.js';

          export default function SectionsRenderer({ children }) {
          	return (
          		<div>
          			<h1>Tarball smoke test</h1>
          			<DefaultSectionsRenderer>{children}</DefaultSectionsRenderer>
          		</div>
          	);
          }
          EOF

          cat > src/components/Button.js <<'EOF'
          import React from 'react';
          import PropTypes from 'prop-types';

          /** The only component in this style guide. */
          export default function Button({ children }) {
          	return <button type="button">{children}</button>;
          }

          Button.propTypes = {
          	children: PropTypes.node,
          };
          EOF

          cat > src/components/Button.md <<'EOF'
          ```jsx
          <Button>Click me</Button>
          ```
          EOF

          npx --no-install styleguidist build

          # The build must exist and must contain the override (its heading text survives minification).
          test -f styleguide/index.html
          grep -rq 'Tarball smoke test' styleguide/

  site:
    # The docs site is strict (`onBrokenLinks: throw`) and every docs/*.md edit can break it, but the
    # deploy workflow only runs after a merge to main. Building here gives pull requests the signal.
    # The example builds are not needed: the landing page links to them with plain <a> tags.
    name: Docs site build
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # No job in this workflow pushes; keep the token out of the checkout so untrusted
          # install scripts and tests cannot read it.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
